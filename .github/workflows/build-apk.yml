name: Build Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Standalone Offline Engine Test
        run: |
          mkdir -p test-standalone/bin
          javac -encoding UTF-8 -d "test-standalone/bin" \
            app/src/main/java/com/abztech/assistant/engine/IActionDispatcher.java \
            app/src/main/java/com/abztech/assistant/engine/IntentType.java \
            app/src/main/java/com/abztech/assistant/engine/IntentResult.java \
            app/src/main/java/com/abztech/assistant/engine/FuzzyMatcher.java \
            app/src/main/java/com/abztech/assistant/engine/MathEvaluator.java \
            app/src/main/java/com/abztech/assistant/engine/OfflineKnowledgeBase.java \
            app/src/main/java/com/abztech/assistant/engine/ContextMemory.java \
            app/src/main/java/com/abztech/assistant/engine/IntentClassifier.java \
            app/src/main/java/com/abztech/assistant/engine/AssistantBrain.java \
            test-standalone/StandaloneBrainTest.java
          java -cp "test-standalone/bin" com.abztech.assistant.StandaloneBrainTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ultron-Assistant-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
